services:
  postgres:
    image: postgres:16
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-epstein}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-epstein}'
      POSTGRES_DB: '${POSTGRES_DB:-epstein_archive}'
    volumes:
      - epstein_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  epstein_postgres_data:
