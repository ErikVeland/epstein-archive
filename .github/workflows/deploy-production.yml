name: Production Deploy

on:
  # Automatic deployment is paused after incident key revocation.
  # Restore it only after provisioning a restricted CI deployment identity.
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: epstein-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://epstein.academy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: epstein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify new release version and notes
        run: pnpm check:release-metadata -- --base HEAD^

      - name: Run database migrations
        run: pnpm db:migrate:pg
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/epstein_test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Unified Quality Gate
        run: ./scripts/quality_gate.sh
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/epstein_test

      - name: Configure SSH key
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_epstein_prod_ed25519"
          chmod 600 "$HOME/.ssh/id_epstein_prod_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to production
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/epstein_test
          EPSTEIN_PROD_HOST: ${{ secrets.PROD_HOST || '194.195.248.217' }}
          EPSTEIN_PROD_SSH_USER: ${{ secrets.PROD_USER || 'svc_epstein' }}
          GH_TOKEN: ${{ github.token }}
        run: ./deploy.sh --with-db --skip-integrity
