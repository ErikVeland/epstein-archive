<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WIRED press archive card for the Epstein Files library article</title>
  <desc id="desc">A durable local press-card thumbnail for the WIRED article in the archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a72c"/>
      <stop offset="1" stop-color="#f5d76e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="64" y="64" width="1072" height="672" rx="18" fill="#0b1020" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96" y="96" width="1008" height="104" fill="#f5f5f5"/>
  <g fill="#0a0a0a" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="6">
    <text x="130" y="176">WIRED</text>
  </g>
  <rect x="96" y="224" width="1008" height="6" fill="url(#gold)"/>
  <text x="96" y="306" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">PRESS ARCHIVE</text>
  <text x="96" y="410" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">
    <tspan x="96" dy="0">A Library Dedicated Solely</tspan>
    <tspan x="96" dy="66">to the Epstein Files Is</tspan>
    <tspan x="96" dy="66">Opening in New York</tspan>
  </text>
  <text x="96" y="664" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Ej Dickson · May 6, 2026</text>
  <circle cx="1014" cy="636" r="72" fill="#111827" stroke="url(#gold)" stroke-width="4"/>
  <path d="M984 636h60M1020 606l30 30-30 30" fill="none" stroke="#f5d76e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
